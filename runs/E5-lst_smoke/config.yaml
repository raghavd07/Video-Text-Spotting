exp_id: E5-lst_smoke
dataset: icdar2015v
split: val
seed: 42
detector: {}
pipeline:
  det_exp: det_ppyoloe_r_text_s
  lsc_exp: E3-lsc
lsc:
  ckpt: runs/E3-lsc/checkpoints/best.pth
  det_thr: 0.3
  iou_neg: 0.05
fusion:
  mode: hard
  w: 0.5
tracker:
  type: lst
  thr: 0.2
  train:
    train_split: train
    val_split: val
    iters: 200
    lr: 5.0e-05
    weight_decay: 0.0001
    warmup_iters: 20
    warmup_factor: 0.001
    min_lr: 0.0
    clip_len: 6
    min_clip_len: 2
    stride: 1
    amp: true
    num_workers: 0
    log_every: 20
    val_every: 100
    smoke_iters: 200
    smoke_val_every: 100
    smoke_val_videos: 2
    smoke: true
voting:
  enabled: false
  tau: 0.5
  min_len: 3
eval:
  iou: 0.5
  spotting: true
