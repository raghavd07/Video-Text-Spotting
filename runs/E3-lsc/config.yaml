exp_id: E3-lsc
dataset: icdar2015v
split: val
seed: 42
detector: {}
lsc:
  ckpt: third_party/ABINet/workdir/train-abinet/best-train-abinet.pth
  det_thr: 0.3
  iou_neg: 0.05
  infer:
    batch_size: 64
    amp: true
  stride: 1
  train:
    data_root: data/lsc
    epochs: 10
    batch_size: 4
    val_batch_size: 2
    lr: 0.0001
    lr_final: 1.0e-05
    decay_epoch: 6
    accum_steps: 2
    amp: true
    clip_grad: 20.0
    num_workers: 0
    log_every: 50
    smoke_samples: 200
    smoke: false
fusion:
  mode: hard
  w: 0.5
tracker:
  type: simple
  thr: 0.5
voting:
  enabled: false
  tau: 0.5
  min_len: 3
eval:
  iou: 0.5
  spotting: true
glyph:
  enabled: false
  weight: 1.0
  loss: mse
  masks_tsv: masks.tsv
  neg_zero: false
