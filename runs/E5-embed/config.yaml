exp_id: E5-embed
dataset: icdar2015v
split: val
seed: 42
detector: {}
pipeline:
  det_exp: det_ppyoloe_r_text_s
  lsc_exp: E3-lsc
lsc:
  ckpt: runs/E3-lsc/checkpoints/best.pth
  det_thr: 0.3
  iou_neg: 0.05
fusion:
  mode: hard
  w: 0.5
tracker:
  type: embed
  thr: 0.5
  high_thr: 0.6
  low_thr: 0.3
  iou_gate: 0.3
  max_age: 15
  text_window: 10
  lam: 0.5
  emb_gate: 0.0
  emb_momentum: 0.9
  ckpt: runs/E5-embed/checkpoints/best.pth
  train:
    train_split: train
    val_split: val
    iters: 3000
    lr: 0.0001
    weight_decay: 0.0001
    warmup_iters: 100
    warmup_factor: 0.001
    min_lr: 0.0
    clip_len: 6
    stride: 1
    temperature: 0.1
    emb_dim: 128
    hidden: 256
    init_ckpt: ''
    amp: true
    log_every: 20
    val_every: 250
    smoke_iters: 100
    smoke_val_every: 50
    smoke_val_videos: 2
    smoke: false
voting:
  enabled: false
  tau: 0.5
  min_len: 3
eval:
  iou: 0.5
  spotting: true
