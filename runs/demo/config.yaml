{
  "exp_id": "demo",
  "dataset": "icdar2015v",
  "split": "val",
  "seed": 42,
  "detector": {
    "weights": "runs/det_yolo11s_obb_text/train/weights/best.pt",
    "batch_size": 2,
    "save_thr": 0.1,
    "input_hw": [
      576,
      1024
    ],
    "device": "gpu",
    "half": true,
    "max_det": 300,
    "nms_iou": 0.7,
    "obb_data": {
      "root": "data/obb",
      "stride": 5,
      "val_stride": 10,
      "mask_dont_care": true
    },
    "train": {
      "init": "models/yolo_obb/yolo11s-obb.pt",
      "epochs": 50,
      "batch": 4,
      "imgsz": 1024,
      "workers": 0,
      "patience": 15,
      "close_mosaic": 5,
      "fliplr": 0.5,
      "degrees": 0.0,
      "smoke_fraction": 0.1,
      "val_conf": 0.05
    }
  },
  "pipeline": {
    "det_exp": "det_yolo11s_obb_text",
    "lsc_exp": "E4-lsc_yolo"
  },
  "lsc": {
    "ckpt": "runs/E3-lsc/checkpoints/best.pth",
    "det_thr": 0.3,
    "iou_neg": 0.05
  },
  "fusion": {
    "mode": "soft",
    "w": 0.5,
    "soft_source": "p_eos"
  },
  "tracker": {
    "type": "lst",
    "thr": 0.4,
    "traj_thr": 0.6,
    "overlap_thr": 0.2,
    "ckpt": "runs/E5-lst/checkpoints/best.pth",
    "train": {
      "train_split": "train",
      "val_split": "val",
      "iters": 30000,
      "lr": "5e-05",
      "weight_decay": 0.0001,
      "warmup_iters": 1000,
      "warmup_factor": 0.001,
      "min_lr": 0.0,
      "clip_len": 6,
      "min_clip_len": 2,
      "stride": 1,
      "amp": true,
      "num_workers": 0,
      "log_every": 20,
      "val_every": 1000,
      "smoke_iters": 200,
      "smoke_val_every": 100,
      "smoke_val_videos": 2
    }
  },
  "voting": {
    "enabled": true,
    "tau": 0.5,
    "min_len": 3
  },
  "eval": {
    "iou": 0.5,
    "spotting": true
  }
}