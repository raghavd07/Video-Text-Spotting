exp_id: det_yolo11s_obb_dota
dataset: icdar2015v
split: val
seed: 42
detector:
  weights: models/yolo_obb/yolo11s-obb.pt
  batch_size: 2
  save_thr: 0.1
  input_hw: [576, 1024]
  device: gpu
  half: true
  max_det: 300
  nms_iou: 0.7
  obb_data:
    root: data/obb
    stride: 5
    val_stride: 10
    mask_dont_care: true
lsc:
  ckpt: null
  det_thr: 0.3
  iou_neg: 0.05
fusion:
  mode: hard
  w: 0.5
tracker:
  type: simple
  thr: 0.5
voting:
  enabled: false
  tau: 0.5
  min_len: 3
eval:
  iou: 0.5
  spotting: true
