# PP-YOLOE-R s fine-tuned for class-agnostic scene text. Only keys that differ from the inherited
# ppyoloe_r_crn_s_3x_dota.yml chain are listed. Paths are relative to the project root (run from there).
# Unchanged on purpose: depth/width_mult 0.33/0.50, Momentum 0.9, L2 5e-4, clip_grad 35, EMA,
# snapshot_epoch 1, head/assigner. AMP cannot be set here: tools/train.py merge_args overwrites cfg.amp
# with its --amp flag, so tools/train_detector.py always passes --amp. Resume = train.py -r <ckpt>.
_BASE_: ['../third_party/PaddleDetection/configs/rotate/ppyoloe_r/ppyoloe_r_crn_s_3x_dota.yml']

num_classes: 1
norm_type: bn                    # single GPU
worker_num: 2
log_iter: 50
pretrain_weights: models/pp_yoloe_r/ppyoloe_r_crn_s_3x_dota.pdparams   # cls head (15->1) not loaded
weights: runs/det_ppyoloe_r_text_s/ckpt/model_final
save_dir: runs/det_ppyoloe_r_text_s/ckpt

epoch: 12
LearningRate:
  base_lr: 0.002                 # 0.008 @ 4 GPU x bs2, scaled linearly to bs2
  schedulers:
    - !CosineDecay
      max_epochs: 14
    - !LinearWarmup
      start_factor: 0.
      steps: 1000

TrainDataset:
  !COCODataSet
    image_dir: frames
    anno_path: det_dota/train.json
    dataset_dir: data
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd', 'gt_poly']

EvalDataset:
  !COCODataSet
    image_dir: frames
    anno_path: det_dota/val.json
    dataset_dir: data
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd', 'gt_poly']

TestDataset:
  !ImageFolder
    anno_path: det_dota/val.json     # only used for the category list
    dataset_dir: data

# input 576x1024 (h, w); the base reader's &image_size anchors do not cross files, so the readers are
# restated. Train aug: dropped the 0/90/180/-90 rotation (video text is near-upright); kept flip and
# the 30/60 deg rotation at p=0.5.
TrainReader:
  sample_transforms:
    - Decode: {}
    - Poly2Array: {}
    - RandomRFlip: {}
    - RandomRRotate: {angle_mode: 'value', angle: [30, 60], rotate_prob: 0.5}
    - RResize: {target_size: [576, 1024], keep_ratio: True, interp: 2}
    - Poly2RBox: {filter_threshold: 2, filter_mode: 'edge', rbox_type: 'oc'}
  batch_transforms:
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
    - PadRGT: {}
    - PadBatch: {pad_to_stride: 32}
  batch_size: 2
  shuffle: true
  drop_last: true
  use_shared_memory: false       # Windows
  collate_batch: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Poly2Array: {}
    - RResize: {target_size: [576, 1024], keep_ratio: True, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 2
  collate_batch: false

TestReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [576, 1024], keep_ratio: True, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 2
