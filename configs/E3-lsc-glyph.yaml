exp_id: E3-lsc-glyph
dataset: icdar2015v
split: val
seed: 42
detector: {}
lsc:
  ckpt: third_party/ABINet/workdir/train-abinet/best-train-abinet.pth  # init weights
  det_thr: 0.3
  iou_neg: 0.05
  infer:                       # logo.lsc.run_lsc
    batch_size: 64
    amp: true
  stride: 1
  train:
    data_root: data/lsc        # built by tools/build_lsc_dataset.py ({train,val}/labels.tsv)
    epochs: 10
    batch_size: 24             # x accum_steps 2 = effective 48 (48 OOMs on the 3050 + 8 GB host); halved on CUDA OOM
    val_batch_size: 64
    lr: 1.0e-4
    lr_final: 1.0e-5
    decay_epoch: 6             # 0-based: epochs 1-6 at lr, 7-10 at lr_final
    accum_steps: 2
    amp: true
    clip_grad: 20.0
    num_workers: 2
    log_every: 50
    smoke_samples: 200
fusion:
  mode: hard
  w: 0.5
tracker:
  type: simple
  thr: 0.5
voting:
  enabled: false
  tau: 0.5
  min_len: 3
eval:
  iou: 0.5
  spotting: true
glyph:                         # logo.glyph.branch (paper Eq. 5), training-only auxiliary head
  enabled: true
  weight: 1.0                  # L_lsc = L_rec + weight * L_seg
  loss: mse                    # mse | bce
  masks_tsv: masks.tsv         # under <data_root>/train, from tools/make_glyph_masks.py
  neg_zero: false              # true: background crops (label "") get an all-zero mask target
