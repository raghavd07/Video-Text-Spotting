exp_id: E4-glyph
dataset: icdar2015v
split: val
seed: 42
detector: {}
pipeline:                      # scripts/run_pipeline.py; CLI --det_exp/--lsc_exp override
  det_exp: det_ppyoloe_r_text_s
lsc:
  ckpt: runs/E3-lsc-glyph/checkpoints/best.pth  # LSC fine-tuned with the glyph branch (GS)
  det_thr: 0.3
  iou_neg: 0.05
  infer:
    batch_size: 64
    amp: true
fusion:                        # hard fusion with the GS-trained LSC
  mode: hard
  w: 0.5
tracker:
  type: simple
  thr: 0.5
voting:
  enabled: false
  tau: 0.5
  min_len: 3
eval:
  iou: 0.5
  spotting: true
  det_score_thr: 0.5           # det eval keeps score_fused > this
